{% extends "base.html" %}
{% block title %}403 - Không đủ quyền truy cập - NEU{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="neu-card p-5 mx-auto" style="max-width: 600px;">
    <div class="text-danger mb-3"><i class="fa-solid fa-shield-xmark fa-4x"></i></div>
    <h2 class="fw-bold text-danger">403 - KHÔNG ĐỦ QUYỀN TRUY CẬP</h2>
    <p class="text-muted mt-3 fs-5">{{ thong_bao or 'Tài khoản của bạn không được phân quyền để thực hiện hoặc xem nội dung trang này.' }}</p>
    <div class="mt-4">
      <a href="{{ url_for('main.trang_chu') }}" class="btn btn-neu-primary me-2"><i class="fa-solid fa-house me-1"></i> Về trang chủ</a>
      <a href="{{ url_for('auth.dang_xuat') }}" class="btn btn-outline-secondary"><i class="fa-solid fa-right-from-bracket me-1"></i> Đăng xuất</a>
    </div>
  </div>
</div>
{% endblock %}
