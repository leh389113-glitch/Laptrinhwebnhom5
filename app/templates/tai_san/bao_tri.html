{% extends "base.html" %}
{% block title %}Ghi nhận bảo trì - {{ tai_san.ma_tai_san }} - NEU{% endblock %}
{% block content %}
<div class="container">

  <div class="neu-page-header">
    <div>
      <h2 class="neu-page-title"><i class="fa-solid fa-screwdriver-wrench text-warning me-2"></i> GHI NHẬN BẢO TRÌ / SỬA CHỮA</h2>
      <small class="text-muted">Tài sản: {{ tai_san.ma_tai_san }} - {{ tai_san.ten_tai_san }}</small>
    </div>
    <div>
      <a href="{{ url_for('tai_san.chi_tiet', id=tai_san.id) }}" class="btn btn-outline-secondary">
        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
      </a>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-7">
      
      <div class="neu-card">
        <div class="neu-card-header bg-warning text-dark">
          <span><i class="fa-solid fa-wrench me-2"></i> Thông tin phiếu bảo trì / sửa chữa</span>
        </div>
        <div class="neu-card-body">

          <form method="POST" action="{{ url_for('tai_san.bao_tri', id=tai_san.id) }}">
            <div class="mb-3">
              <label class="neu-form-label">Nội dung sửa chữa / Bảo trì <span class="text-danger">*</span></label>
              <input type="text" name="noi_dung" class="form-control neu-form-control" placeholder="Ví dụ: Thay thế bóng đèn máy chiếu, nạp gas điều hòa..." required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="neu-form-label">Chi phí sửa chữa (VNĐ)</label>
                <input type="number" name="chi_phi" class="form-control neu-form-control" value="0" min="0" step="1000">
              </div>
              <div class="col-md-6">
                <label class="neu-form-label">Đơn vị thực hiện</label>
                <input type="text" name="don_vi_thuc_hien" class="form-control neu-form-control" placeholder="Ví dụ: Đội kỹ thuật NEU hoặc Công ty ABC">
              </div>
            </div>

            <div class="mb-3">
              <label class="neu-form-label">Cập nhật trạng thái tài sản sau sửa chữa</label>
              <select name="trang_thai_moi" class="form-select neu-form-control">
                <option value="dang_su_dung" selected>Đang sử dụng (Đã sửa xong, hoạt động tốt)</option>
                <option value="dang_sua_chua">Đang sửa chữa (Chưa hoàn thành)</option>
                <option value="cho_thanh_ly">Chờ thanh lý (Hỏng nặng không thể sửa)</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="neu-form-label">Ghi chú chi tiết</label>
              <textarea name="ghi_chu" rows="3" class="form-control neu-form-control" placeholder="Ghi nhận linh kiện thay thế, thời gian bảo hành..."></textarea>
            </div>

            <div class="text-end">
              <a href="{{ url_for('tai_san.chi_tiet', id=tai_san.id) }}" class="btn btn-outline-secondary me-2">Hủy</a>
              <button type="submit" class="btn btn-warning fw-bold text-dark px-4">
                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thông tin bảo trì
              </button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>

</div>
{% endblock %}
